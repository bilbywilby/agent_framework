[project]
name = "agent_framework"
version = "0.1.0"
description = "Production-grade async agentic framework for Vertex AI (Gemini)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Your Team"}]
keywords = ["agents", "vertex-ai", "gemini", "async", "framework"]

dependencies = [
    "google-cloud-vertex-ai>=1.40.0",
    "google-api-core>=2.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
docs = ["sphinx>=7.1.0", "sphinx-rtd-theme>=1.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
